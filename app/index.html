  <body>
    <noscript>
      <div style="max-width:680px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif;color:#e8edf7;background:#172238;border:1px solid #2c3a58;border-radius:14px;">
        <h1 style="margin:0 0 8px;">✈️ Viajes — planeador y recomendador con IA</h1>
        <p style="color:#94a3b8;">Planeá tu próximo viaje en minutos: descubrí destinos según el clima de la fecha, generá itinerarios día por día con IA, controlá presupuesto y gastos en grupo, y exportá todo a tu calendario o PDF.</p>
        <h2 style="margin-top:24px;">Qué hace</h2>
        <ul style="line-height:1.7;color:#cbd5e1;">
          <li><strong>Descubrir destinos</strong> por clima del mes y preferencias (playa, montaña, ciudad…)</li>
          <li><strong>Itinerarios con IA</strong> (tu propia API key de Anthropic) o borrador rápido sin IA</li>
          <li><strong>Importar reservas</strong> pegando un mail de confirmación: la IA extrae los datos</li>
          <li><strong>Gastos del grupo</strong> con balances y quién le debe a quién</li>
          <li><strong>Reservar</strong> con links directos a Google Flights, Skyscanner, Booking y GetYourGuide</li>
          <li><strong>Exportar a calendario</strong> (.ics) y a <strong>PDF</strong> para llevar offline</li>
          <li><strong>Compartir</strong> el viaje por un link (sin servidor)</li>
          <li><strong>PWA</strong> instalable, funciona offline</li>
        </ul>
        <p style="color:#94a3b8;margin-top:24px;">Esta app necesita JavaScript habilitado para funcionar.</p>
      </div>
    </noscript>
    <div id="root"></div>
